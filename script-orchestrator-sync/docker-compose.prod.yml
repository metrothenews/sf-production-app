services:
  app:
    build:
      context: ..
      dockerfile: script-orchestrator-sync/Dockerfile
      args:
        BLENDER_VERSION: ${BLENDER_VERSION:-4.2.2}
    image: script-orchestrator-sync:prod
    working_dir: /workspace/script-orchestrator-sync
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      PYTHONPATH: /workspace/script-orchestrator-sync/src
      SHEETS_JSON_BASE_URL: ${SHEETS_JSON_BASE_URL:-https://YOUR-SHEETS-JSON-GATEWAY.a.run.app}
      SHEETS_JSON_API_KEY: ${SHEETS_JSON_API_KEY:-}
      CONTROL_SHEET_ID: ${CONTROL_SHEET_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/google-application-credentials.json}
      REQUIRE_RENDER_BINARIES: ${REQUIRE_RENDER_BINARIES:-1}
    ports:
      - "${APP_PORT:-8000}:8000"
    command: ["uvicorn", "so_sync.api:app", "--host", "0.0.0.0", "--port", "8000"]
